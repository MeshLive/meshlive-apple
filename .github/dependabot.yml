# Weekly update checks. The github-actions entry keeps .github/workflows/ci.yml current. There are no
# external Swift Package dependencies (third-party code is vendored under Vendor/ with its licences), so the
# swift entry is idle until a `.package(...)` dependency is added.
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
